<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma Escolar - Sistema de Gestão</title>
    <!-- Bootstrap 5.1.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap 5.1.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <!-- FullCalendar CSS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js'></script>
    <!-- jQuery (para facilitar as chamadas AJAX) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link rel="stylesheet" href="../styles/styleCronograma.css">
</head>
<body>
  <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm border-bottom" style="background: url('https://i.postimg.cc/L6DG6bj1/image.png') center/cover no-repeat;">
        <div class="container-fluid">
           <button class="navbar-toggler me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                <span class="navbar-toggler-icon"></span>
            </button> 
            <a target='_blank'>
              <img class="image-logo" src='https://i.postimg.cc/Wd5wGHgS/logocrono-removebg-preview.png' alt='CronoEscolar'>
            </a>
            <a class="navbar-brand text-muted" href="#">
              Sistema de Gestão de Cronograma Escolar
            </a>
            <div class="navbar-nav ms-auto">
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        João Silva
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Perfil</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Configurações</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right me-2"></i>Sair</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
   <!-- Main Container -->
    <div class="container-fluid">
        <div class="row">
            <!-- Main Content -->
            <main class="col-lg-10 col-12 px-md-4 mt-3">
                <div id="loading-spinner" class="loading-spinner">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                    <p class="mt-2">Carregando cronograma...</p>
                </div>
                <div id='calendar'></div>  
            </main>
        </div>
    </div>

    <!-- Modal de CPF -->
    <div class="modal fade" id="modalCPF" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

        <div class="modal-header">
            <h5 class="modal-title">Identificação do Aluno</h5>
        </div>

        <div class="modal-body">

            <!-- Passo 1: Digitar CPF -->
            <div id="divCpf">
            <label class="form-label">Digite o CPF do aluno:</label>
            <input id="inputCpf" class="form-control" maxlength="14" placeholder="000.000.000-00">
            <button id="btnBuscarAluno" class="btn btn-primary mt-3 w-100">
                Buscar aluno
            </button>

            <div id="loadingBusca" class="text-center mt-3 d-none">
                <div class="spinner-border text-primary"></div>
                <p>Buscando aluno...</p>
            </div>

            <div id="msgErro" class="alert alert-danger mt-3 d-none"></div>
            </div>

            <!-- Passo 2: Exibir nome e selecionar turma -->
            <div id="divTurmas" class="d-none">
            <h6>Aluno encontrado:</h6>
            <p id="nomeAluno" class="fw-bold"></p>

            <label class="form-label">Selecione a turma:</label>
            <select id="selectTurma" class="form-select"></select>

            <button id="btnConfirmarTurma" class="btn btn-success mt-3 w-100">
                Confirmar
            </button>
            </div>

        </div>

        </div>
    </div>
    </div>


    <script src="../lib/cronograma_aluno.js"></script>
</body>
</html>
