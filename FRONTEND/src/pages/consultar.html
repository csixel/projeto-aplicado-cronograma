<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consultar Professores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>
  <main class="py-4">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-xl-10">
          <div class="card shadow-sm">
            <div class="card-header bg-white d-flex align-items-center justify-content-between">
              <h1 class="h4 mb-0">Professores Cadastrados</h1>
              <div class="d-flex gap-2">
                <a href="professores.html" class="btn btn-outline-secondary">Voltar</a>
              </div>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-sm align-middle">
                  <thead>
                    <tr>
                      <th>Nome</th>
                      <th>Email</th>
                      <th>Disciplina</th>
                      <th>Telefone</th>
                      <th>CPF</th>
                      <th>Ações</th>
                    </tr>
                  </thead>
                  <tbody id="lista-professores">
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal de Edição -->
  <div class="modal fade" id="editarModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar Professor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="form-editar">
            <input type="hidden" id="edit-id">
            <div class="mb-3">
              <label for="edit-nome" class="form-label">Nome</label>
              <input type="text" class="form-control" id="edit-nome" required>
            </div>
            <div class="mb-3">
              <label for="edit-email" class="form-label">Email</label>
              <input type="email" class="form-control" id="edit-email" required>
            </div>
            <div class="mb-3">
              <label for="edit-disciplina" class="form-label">Disciplina</label>
              <input type="text" class="form-control" id="edit-disciplina" required>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="edit-telefone" class="form-label">Telefone</label>
                <input type="tel" class="form-control" id="edit-telefone"
                maxlength="15" oninput="formatarTelefone(this)">
              </div>
              <div class="col-md-6">
                <label for="edit-cpf" class="form-label">CPF</label>
                <input type="text" class="form-control" id="edit-cpf" maxlength="14" oninput="formatarCPF(this)">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btn-salvar-edicao" class="btn btn-primary">Salvar alterações</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="../lib/consultarGet.js"></script>
  <script src="../lib/updateModalProfessores.js"></script>
  <script src="../lib/formatarCampos.js"></script>
  <script src="../lib/deleteProfessor.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      carregarProfessores();
      document.getElementById('btn-salvar-edicao').addEventListener('click', salvarEdicao);
    });
  </script>

</body>

</html>
